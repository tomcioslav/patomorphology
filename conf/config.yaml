defaults:
  - net: unet
  - dataset: nmsc-2x-unet-512
  - lr: constant_1e4
  - pipeline: unet
  - _self_

max_epochs: 15
fast_dev_run: false

# Optional path to a previous run's .ckpt — warm-starts `model.*` weights
# only (no optimizer/scheduler state restored). Set on the CLI:
#   pipeline=sam_full init_from_checkpoint=runs/sam_head-.../checkpoints/best-...ckpt
init_from_checkpoint: null

hydra:
  job:
    chdir: false
  run:
    dir: outputs/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: outputs/multirun/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}
