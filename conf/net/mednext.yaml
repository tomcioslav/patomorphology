# MedNeXt-B — ConvNeXt-style segmentation network (Roy et al., MICCAI
# 2023). Drop-in `net=` swap: same input (3×512×512), same inference
# output (num_classes×512×512 via sliding window).
#
# MedNeXt is built to run inside the nnU-Net framework, so pair it with
# `pipeline=nnunet` (SGD+Nesterov, deep supervision, heavy augmentation)
# and `lr=poly` for the full recipe:
#
#   uv run python scripts/train.py pipeline=nnunet net=mednext lr=poly \
#       dataset=nmsc-2x-unet-512
#
# Clean A/B against `net=nnunet` (DynUNet) — same pipeline, same tiles,
# same val source, only the architecture differs.
#
# This is the MedNeXt-B preset. For a smaller/faster model set every
# expansion ratio to 2 (the MedNeXt-S preset). kernel_size=3 — kernel-5
# MedNeXt needs the paper's UpKern warm-start trick, not wired up here.
_target_: pato.components.models.mednext.MedNeXt

num_classes: 2
in_channels: 3
init_filters: 32
kernel_size: 3
encoder_expansion_ratio: [2, 3, 4, 4]
decoder_expansion_ratio: [4, 4, 3, 2]
bottleneck_expansion_ratio: 4
blocks_down: [2, 2, 2, 2]
blocks_bottleneck: 2
blocks_up: [2, 2, 2, 2]
norm_type: group
deep_supervision: true
use_residual_connection: true
global_resp_norm: false
