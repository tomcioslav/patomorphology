# Smaller / faster UNet for iteration. Needs a separate 256-tile cache:
#   python -c "from config import paths; from pato.dataset import DatasetViewer; \
#              from pato.pipelines.unet.preprocess import preprocess; \
#              preprocess(DatasetViewer(root=paths.data_processed/'${dataset}'), \
#                         paths.data_processed/'${dataset}-unet-256', target_size=256)"
defaults:
  - unet
  - _self_

dataset_root: ${data_processed_root}/${dataset}-unet-256
batch_size: 8
max_epochs: 3
