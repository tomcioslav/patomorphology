[project]
name = "pato"
version = "0.1.0"
description = "AI pipeline for predicting cancer changes in skin histopathology (H&E) whole-slide images"
readme = "README.md"
authors = [
    { name = "Tomek Juszczyszyn", email = "tomek.juszczyszyn@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "hydra-core>=1.3.2",
    "lightning>=2.6.1",
    "monai>=1.5.2",
    "pillow>=12.2.0",
    "plotly>=6.7.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0.3",
    "tensorboard>=2.20.0",
    "torch>=2.11.0",
    "transformers>=5.8.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "nbstripout>=0.9.1",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
