[project]
name = "pato"
version = "0.1.0"
description = "AI pipeline for predicting cancer changes in pathology images"
readme = "README.md"
authors = [
    { name = "Tomek Juszczyszyn", email = "tomek.juszczyszyn@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
